<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock
        
    </title>
    <style>
        body{
            background-color: black;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        .js-moves{
          color:white;  

        }
        .js-result{
            color:white;
            font-weight: 700;
            font-size: 20px;

        }
        .move-button{
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background-color: transparent;
            border: 2px solid white;

        }
        .move-button:hover{
            background-color: aliceblue;

        }
        .move-icon{
            height:50px;
            border-radius: 50%;
            object-fit: cover;
            
        }
        .js-score{
            color:white;

        }
        .re-btn{
            height:30px;
            width: 100px;
            font-size: 14px;
            background-color: white;
            border:none;
            border-radius: 20px;
            transition:transform ;
        }
.re-btn:hover{
    transform: scale(1.1);

}
h1{
    color:white;
}
    </style>
</head>
<body>
    <div>
    <h1>Rock Paper Scissors Game</h1>
    <p>
        Rock Paper Scissors
    </p>
    <button onclick="
   playGame('rock'); " class="move-button"><img class="move-icon" src="rock-emoji.png">
</button>
    <button onclick="
    playGame('paper')" class="move-button"><img class="move-icon" src="paper-emoji.png"></button>
    <button 
    onclick="
 playGame('scissors');

    "
    class="move-button"><img class="move-icon" src="scissors-emoji.png"></button>
    <p class="js-result"></p>
    <p class="js-moves"></p>
    <p class="js-score"></p>
    <button onclick="score.wins=0;
    score.loses=0;
    score.ties=0;
    localStorage.removeItem('score');
    updateScore();" class="re-btn" >Reset score</button>
    </div>
    <script>
        
        let score=JSON.parse(localStorage.getItem('score') || '{"wins":0,"loses":0,"ties":0}');
        
        updateScore();
        function playGame(playerMove){
    const computer= pickMove();
                        let result='';
                        if(playerMove==='scissors'){
                            if(computer==='rock'){
                        result='You lose';
                    }
                        else if(computer==='paper'){
                        result='You win';
                        }
                        else if(computer==='scissors'){
                        result='Tie';
                        }
                    }
                    else if(playerMove==='rock'){
                    if(computer==='rock'){
                        result='Tie';
                    }
                        else if(computer==='paper'){
                        result='You lose';
                        }
                        else if(computer==='scissors'){
                        result='You win';
                        }
    
                        }
             else if(playerMove==='paper'){
                             if(computer==='rock'){
                             result='You win';
                                }
                        else if(computer==='paper'){
                                    result='Tie';
                                    }
                                    else if(computer==='scissors'){
                                    result='You lose';
                                    }
                        }
                        if(result==='You win'){
                            score.wins=score.wins+1;
            
        }
        else if(result==='You lose'){
            score.loses=score.loses+1;
        }
        else if(result==='Tie'){
            score.ties=score.ties+1;
        }
        localStorage.setItem('score',JSON.stringify(score));
        updateScore();

        document.querySelector('.js-result').innerHTML=result;

        document.querySelector('.js-moves').innerHTML=`You 
        <img src= ${playerMove}-emoji.png class="move-icon">
        <img src=${computer}-emoji.png class="move-icon">
        Computer`;

                        

                            }
                        
 function updateScore(){
    document.querySelector('.js-score').innerHTML= `Wins:${score.wins}     Loses:${score.loses}      Ties:${score.ties}`;
 }
                let computer='';
                function pickMove(){
                const randomNum=Math.random();
            
                if(randomNum>=0 &&randomNum<1/3 ){
                computer='rock';
                }
                else if(randomNum>=1/3 && randomNum<2/3){
                    computer='paper';
                }
                else if(randomNum>=2/3 && randomNum<1){
                computer='scissors';
                }
                console.log(computer)
return computer;
        }
        
    </script>
    
</body>
</html>
